<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="theme-color" content="#0d0f14">
<title>Lift</title>
<style>
:root{--bg:#0d0f14;--card:#171a22;--line:#2a303c;--text:#eceef3;--mut:#9aa1af;--acc:#ffb547;--bad:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 150px)}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 16px}
h2{font-size:14px;font-weight:600;color:var(--mut);margin:20px 0 8px}
button,input,select{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.ex{font-size:18px;font-weight:700}
input,select{width:100%;min-height:46px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{border-color:var(--acc)}
.btn,.ghost{width:100%;min-height:48px;border:0;border-radius:12px;padding:12px;font-weight:650;margin-top:10px;cursor:pointer}
.btn{background:var(--acc);color:#1a1200}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lnk{background:none;border:0;color:var(--mut);min-height:44px;padding:0 12px 0 0;cursor:pointer}
.danger{color:var(--bad)}
.x{background:none;border:0;color:var(--mut);font-size:20px;min-width:44px;min-height:44px;cursor:pointer}
.sh,.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;margin-top:8px}
.sh{color:var(--mut);font-size:13px;text-align:center;margin-top:12px}
.set .n{color:var(--mut);text-align:center}
.chk{height:46px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:22px;cursor:pointer}
.set.done .chk{background:var(--acc);border-color:var(--acc);color:#1a1200}
.set.done input{opacity:.5}
.sess{position:sticky;top:0;z-index:5;margin:0 -16px 12px;padding:10px 16px;background:rgba(13,15,20,.96);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.sess .btn{width:auto;margin:0;padding:10px 20px}
.t{color:var(--acc);font-variant-numeric:tabular-nums}
.hx{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.hx .mut{text-align:right}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stats .card{margin:0}.stats b{font-size:22px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:rgba(13,15,20,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-height:54px;background:none;border:0;color:var(--mut);font-weight:600;cursor:pointer}
nav button.on{color:var(--acc);box-shadow:inset 0 2px 0 var(--acc)}
#rest,#toast{position:fixed;left:12px;right:12px;max-width:496px;margin:0 auto;z-index:9;display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:12px;padding:6px 6px 6px 16px}
#rest{bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--acc);color:#1a1200;font-weight:700}
#rest button{background:rgba(0,0,0,.15);color:#1a1200;border:0;border-radius:8px;min-height:40px;padding:0 14px;font-weight:700;cursor:pointer}
#toast{bottom:calc(122px + env(safe-area-inset-bottom,0px));background:#2a303c}
#toast button{background:none;border:0;color:var(--acc);font-weight:700;min-height:40px;padding:0 12px;cursor:pointer}
[hidden]{display:none!important}
#dlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:24px}
#dlg .card{width:100%;max-width:360px;margin:0}
.btn.dgr{background:var(--bad)}
#picker{position:fixed;inset:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;max-width:520px;margin:0 auto}
#pl{overflow:auto;flex:1;margin-top:8px}
.pi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:14px 4px;min-height:48px;cursor:pointer}
.pi.acc{color:var(--acc);font-weight:650}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest" hidden><span id="rt"></span><span><button onclick="restAdd()">+15s</button> <button onclick="restSkip()">Skip</button></span></div>
<div id="toast" hidden></div>
<div id="picker" hidden></div>
<div id="dlg" hidden></div>
<nav>
<button data-t="workout" onclick="go('workout')">Workout</button>
<button data-t="history" onclick="go('history')">History</button>
<button data-t="progress" onclick="go('progress')">Progress</button>
<button data-t="body" onclick="go('body')">Body</button>
</nav>
<script>
const KEY='lift.v1',REST=90;
const SEED=['Bench Press','Incline Dumbbell Press','Overhead Press','Lateral Raise','Triceps Pushdown','Squat','Romanian Deadlift','Leg Press','Leg Curl','Leg Extension','Calf Raise','Deadlift','Barbell Row','Pull-up','Lat Pulldown','Seated Cable Row','Face Pull','Barbell Curl','Dumbbell Curl','Hammer Curl','Dips','Push-up'];
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{};S.workouts=S.workouts||[];S.custom=S.custom||[];S.templates=S.templates||[];S.active=S.active||null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let tab='workout',progEx=null,rest=null,undoSnap=null,toastT;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>+(+n).toFixed(1);
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
const clock=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const allEx=()=>[...new Set([...SEED,...S.custom,...S.workouts.flatMap(w=>w.entries.map(e=>e.ex))])].sort();
const lastSets=ex=>{for(const w of S.workouts){const e=w.entries.find(e=>e.ex===ex);if(e)return e.sets}return null};

function toast(msg,undo){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>`+(undo?'<button onclick="doUndo()">Undo</button>':'');
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,5000);
}
function doUndo(){if(undoSnap){S=JSON.parse(undoSnap);undoSnap=null;save();render()}$('#toast').hidden=true}
function destructive(msg,fn){undoSnap=JSON.stringify(S);fn();save();render();toast(msg,true)}

function go(t){tab=t;render();window.scrollTo(0,0)}
function pushEx(name){
  const l=lastSets(name),n=l?l.length:3,sets=[];
  for(let j=0;j<n;j++){const p=l?(l[j]||l[l.length-1]):null;sets.push({w:p?p.w:'',r:p?p.r:'',done:false})}
  S.active.entries.push({ex:name,sets});
}
function start(tid){
  const t=S.templates.find(t=>t.id===tid);
  S.active={start:Date.now(),name:t?t.name:'Workout',entries:[]};
  if(t)t.exercises.forEach(pushEx);
  save();render();
}
function addEx(name){
  name=(name||'').trim();if(!name)return;
  if(!S.active)S.active={start:Date.now(),name:'Workout',entries:[]};
  if(S.active.entries.some(e=>e.ex===name))return;
  if(!allEx().includes(name))S.custom.push(name);
  pushEx(name);save();render();filterPicker($('#pq')?$('#pq').value:'');
}
function addSet(i){const e=S.active.entries[i],p=e.sets[e.sets.length-1];e.sets.push({w:p?p.w:'',r:p?p.r:'',done:false});save();render()}
function rmSet(i){const e=S.active.entries[i];if(e.sets.length>1)destructive('Set removed',()=>e.sets.pop())}
function upd(i,j,k,v){S.active.entries[i].sets[j][k]=v;save()}
function toggle(i,j){
  const s=S.active.entries[i].sets[j];
  if(!s.done&&(s.w===''||!(+s.w>=0)||!(+s.r>0))){toast('Enter weight and reps first');return}
  s.done=!s.done;if(s.done)rest=Date.now()+REST*1000;save();render();
}
function rmEx(i){destructive('Exercise removed',()=>{S.active.entries.splice(i,1);if(!S.active.entries.length)S.active=null})}
let dlgCb=null;
function dlg(title,o,cb){
  dlgCb=cb;const d=$('#dlg');d.hidden=false;
  d.innerHTML=`<div class="card" role="dialog" aria-label="${esc(title)}"><b class="ex">${esc(title)}</b>${o.text!==undefined?`<input id="dv"${o.num?' inputmode="decimal"':''} value="${esc(o.text)}" style="margin-top:12px" aria-label="${esc(title)}">`:''}<div class="two"><button class="ghost" onclick="dlgClose()">Cancel</button><button class="btn${o.danger?' dgr':''}" onclick="dlgOk()">${esc(o.ok||'OK')}</button></div></div>`;
  const i=$('#dv');if(i){i.focus();i.select()}
}
function dlgClose(){$('#dlg').hidden=true;dlgCb=null}
function dlgOk(){const i=$('#dv'),v=i?i.value:true,cb=dlgCb;dlgClose();if(cb)cb(v)}
function discard(){dlg('Discard this workout?',{ok:'Discard',danger:1},()=>{S.active=null;rest=null;save();render()})}
function finish(){
  const entries=S.active.entries.map(e=>({ex:e.ex,sets:e.sets.filter(s=>s.done).map(s=>({w:+s.w,r:+s.r}))})).filter(e=>e.sets.length);
  if(!entries.length){toast('Tap ✓ on at least one set to save it');return}
  S.workouts.unshift({id:Date.now(),name:S.active.name,date:S.active.start,entries});
  S.active=null;rest=null;save();go('history');toast('Workout saved');
}
function saveTpl(){
  const a=S.active;
  dlg('Template name',{text:a.name!=='Workout'?a.name:'',ok:'Save'},name=>{
    if(!name.trim())return;
    S.templates.push({id:Date.now(),name:name.trim(),exercises:a.entries.map(e=>e.ex)});a.name=name.trim();save();render();toast('Template saved');
  });
}
function renameTpl(id){const t=S.templates.find(t=>t.id===id);dlg('Rename template',{text:t.name,ok:'Save'},n=>{if(n.trim()){t.name=n.trim();save();render()}})}
function delTpl(id){destructive('Template deleted',()=>S.templates=S.templates.filter(t=>t.id!==id))}
function delW(i){destructive('Workout deleted',()=>S.workouts.splice(i,1))}
function restAdd(){rest=Math.max(rest,Date.now())+15000;tick()}
function restSkip(){rest=null;render()}
function openPicker(){
  const p=$('#picker');p.hidden=false;
  p.innerHTML=`<div class="row"><input id="pq" placeholder="Search or create exercise" aria-label="Search exercises" autocomplete="off" oninput="filterPicker(this.value)"><button class="lnk" style="padding-left:12px;color:var(--acc)" onclick="closePicker()">Done</button></div><div id="pl"></div>`;
  filterPicker('');$('#pq').focus();
}
function closePicker(){$('#picker').hidden=true}
function pick(n){addEx(n)}
function filterPicker(q){
  const pl=$('#pl');if(!pl||$('#picker').hidden)return;
  const used=new Set(S.active?S.active.entries.map(e=>e.ex):[]),qq=q.trim().toLowerCase();
  const recent=[...new Set(S.workouts.flatMap(w=>w.entries.map(e=>e.ex)))];
  const list=[...new Set([...recent,...allEx()])].filter(x=>!used.has(x)&&x.toLowerCase().includes(qq));
  const make=qq&&!allEx().some(x=>x.toLowerCase()===qq);
  pl.innerHTML=(make?`<button class="pi acc" data-n="${esc(q.trim())}" onclick="pick(this.dataset.n)">+ Create “${esc(q.trim())}”</button>`:'')+
    list.map(x=>`<button class="pi" data-n="${esc(x)}" onclick="pick(this.dataset.n)">${esc(x)}</button>`).join('')||'<p class="mut">No matches.</p>';
}
async function exportCsv(){
  const rows=['date,workout,exercise,set,weight_kg,reps'];
  S.workouts.slice().reverse().forEach(w=>w.entries.forEach(e=>e.sets.forEach((s,k)=>rows.push([new Date(w.date).toISOString().slice(0,10),'"'+(w.name||'Workout')+'"','"'+e.ex.replace(/"/g,'""')+'"',k+1,s.w,s.r].join(',')))));
  const f=new File([rows.join('\n')],'lift-backup.csv',{type:'text/csv'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();
}

function vWorkout(){
  const a=S.active;
  if(!a){
    let h='<h1>Workout</h1>';
    if(S.templates.length){
      h+='<h2>Your templates</h2>'+S.templates.map(t=>`<div class="card"><b class="ex">${esc(t.name)}</b><div class="mut">${t.exercises.map(esc).join(', ')}</div>
      <button class="btn" onclick="start(${t.id})">Start ${esc(t.name)}</button>
      <button class="lnk" onclick="renameTpl(${t.id})">Rename</button><button class="lnk danger" onclick="delTpl(${t.id})">Delete</button></div>`).join('');
    }else h+='<div class="card"><b>No templates yet</b><div class="mut">Do a workout, then tap “Save as template” to start it in one tap next time.</div></div>';
    return h+'<button class="ghost" onclick="start()">Start empty workout</button>';
  }
  const tot=a.entries.reduce((n,e)=>n+e.sets.length,0),dn=a.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  let h=`<div class="sess"><div><b>${esc(a.name)}</b> <span class="t" id="el"></span><div class="mut">${dn} of ${tot} sets done</div></div><button class="btn" onclick="finish()">Finish</button></div>`;
  a.entries.forEach((e,i)=>{
    const l=lastSets(e.ex);
    h+=`<div class="card"><div class="row"><span class="ex">${esc(e.ex)}</span><button class="x" aria-label="Remove ${esc(e.ex)}" onclick="rmEx(${i})">✕</button></div>
    <div class="mut">${l?'Last time: '+l.map(s=>fmt(s.w)+' × '+s.r).join(', '):'First time'}</div>
    <div class="sh"><span>Set</span><span>kg</span><span>Reps</span><span></span></div>`+
    e.sets.map((s,j)=>`<div class="set${s.done?' done':''}"><span class="n">${j+1}</span>
    <input type="number" inputmode="decimal" aria-label="Set ${j+1} weight in kg" value="${s.w}" onfocus="this.select()" oninput="upd(${i},${j},'w',this.value)">
    <input type="number" inputmode="numeric" aria-label="Set ${j+1} reps" value="${s.r}" onfocus="this.select()" oninput="upd(${i},${j},'r',this.value)">
    <button class="chk" aria-label="${s.done?'Undo':'Complete'} set ${j+1}" aria-pressed="${s.done}" onclick="toggle(${i},${j})">✓</button></div>`).join('')+
    `<div class="two"><button class="ghost" onclick="addSet(${i})">+ Add set</button><button class="ghost" onclick="rmSet(${i})"${e.sets.length<2?' disabled':''}>− Remove set</button></div></div>`;
  });
  return h+`<button class="btn" onclick="openPicker()">+ Add exercise</button>
  <button class="ghost" onclick="saveTpl()">Save as template</button>
  <button class="lnk danger" style="width:100%;margin-top:8px" onclick="discard()">Discard workout</button>`;
}
function vHistory(){
  let h='<h1>History</h1>';
  if(!S.workouts.length)return h+'<div class="card"><b>No workouts yet</b><div class="mut">Finish a workout and it will show up here.</div></div>';
  h+=S.workouts.map((w,i)=>{
    const vol=w.entries.reduce((n,e)=>n+e.sets.reduce((m,s)=>m+s.w*s.r,0),0);
    return `<div class="card"><div class="row"><div><b>${esc(w.name||'Workout')}</b><div class="mut">${new Date(w.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})} — ${fmt(vol)} kg total</div></div><button class="x" aria-label="Delete workout" onclick="delW(${i})">✕</button></div>
    ${w.entries.map(e=>`<div class="hx"><span>${esc(e.ex)}</span><span class="mut">${e.sets.map(s=>fmt(s.w)+'×'+s.r).join('  ')}</span></div>`).join('')}</div>`}).join('');
  return h+'<button class="ghost" onclick="exportCsv()">Export CSV backup</button>';
}
function chart(v,label){
  const W=320,H=140,p=14,mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
  const x=i=>v.length>1?p+i*(W-2*p)/(v.length-1):W/2,y=n=>H-p-(n-mn)/r*(H-2*p);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${label||'Estimated 1RM trend'}"><polyline fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" points="${v.map((n,i)=>x(i)+','+y(n)).join(' ')}"/>${v.map((n,i)=>`<circle cx="${x(i)}" cy="${y(n)}" r="4" fill="var(--acc)"/>`).join('')}</svg>`;
}
function vProgress(){
  let h='<h1>Progress</h1>';
  const exs=[...new Set(S.workouts.flatMap(w=>w.entries.map(e=>e.ex)))].sort();
  if(!exs.length)return h+'<div class="card"><b>Nothing to chart yet</b><div class="mut">Finish a workout to see your lifts here.</div></div>';
  if(!exs.includes(progEx))progEx=exs[0];
  h+=`<select aria-label="Exercise" onchange="progEx=this.value;render()">${exs.map(x=>`<option${x===progEx?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
  const pts=S.workouts.slice().reverse().map(w=>{const e=w.entries.find(e=>e.ex===progEx);return e&&{top:Math.max(...e.sets.map(s=>s.w)),est:Math.max(...e.sets.map(s=>e1rm(s.w,s.r)))}}).filter(Boolean);
  const f=pts[0].est,l=pts[pts.length-1].est;
  return h+`<div class="stats"><div class="card"><div class="mut">Heaviest set</div><b>${fmt(Math.max(...pts.map(p=>p.top)))} kg</b></div><div class="card"><div class="mut">Best est. 1RM</div><b>${fmt(Math.max(...pts.map(p=>p.est)))} kg</b></div></div>
  <div class="card"><div class="mut">Est. 1RM per workout</div>${chart(pts.map(p=>p.est))}<div class="mut">${pts.length>1?`First ${fmt(f)} kg → latest ${fmt(l)} kg (${l>=f?'+':''}${fmt(l-f)})`:'Log more workouts to see a trend.'}</div></div>`;
}
function setGoal(g){S.body.goal=g;save();render()}
function changeGoal(){S.body.goal=null;save();render()}
function setTarget(){dlg('Target weight (kg)',{text:S.body.target||'',num:1,ok:'Save'},v=>{const n=parseFloat(v);S.body.target=n>0?n:null;save();render()})}
function logW(){
  const v=parseFloat($('#bw').value);if(!(v>0&&v<500)){toast('Enter your weight in kg');return}
  const d=new Date();d.setHours(0,0,0,0);const t=d.getTime(),L=S.body.log,i=L.findIndex(x=>x.d===t);
  if(i>=0)L[i].w=v;else L.push({d:t,w:v});
  L.sort((a,b)=>a.d-b.d);save();render();toast('Weight logged');
}
function delBW(t){destructive('Entry deleted',()=>S.body.log=S.body.log.filter(x=>x.d!==t))}
function slope(L){
  const cut=Date.now()-28*864e5,p=L.filter(x=>x.d>=cut);
  if(p.length<3||p[p.length-1].d-p[0].d<6*864e5)return null;
  const n=p.length,xs=p.map(x=>(x.d-p[0].d)/864e5),ys=p.map(x=>x.w),mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let num=0,den=0;xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});
  return den?num/den*7:null;
}
function pace(g,sl,w){
  if(sl===null)return 'Log a few weigh-ins across a week to see your pace.';
  const pct=sl/w*100,a=Math.abs(pct).toFixed(2),k=fmt(Math.abs(sl));
  if(Math.abs(pct)<0.05)return 'Holding steady at the moment.';
  if(g==='lose'){
    if(pct>0)return `Trending up ${k} kg/week. Not yet in line with your goal.`;
    if(-pct<0.25)return `Down ${k} kg/week. Slow so far, which is normal week to week.`;
    if(-pct<=1)return `Down ${k} kg/week (${a}% of body weight). On track.`;
    return `Down ${k} kg/week (${a}%). Faster than the usual 0.25–1% a week. Slowing down is safer.`;
  }
  if(pct<0)return `Trending down ${k} kg/week. Not yet in line with your goal.`;
  if(pct<0.25)return `Up ${k} kg/week. Slow so far, which is normal week to week.`;
  if(pct<=0.5)return `Up ${k} kg/week (${a}% of body weight). On track.`;
  return `Up ${k} kg/week (${a}%). Faster than the usual 0.25–0.5% a week, so more of it may be fat.`;
}
function vBody(){
  let h='<h1>Body</h1>';
  const b=S.body||(S.body={log:[]});
  if(!b.goal)return h+`<div class="card"><b class="ex">What's your goal?</b><div class="mut">Your pace and progress are judged against this.</div><button class="btn" onclick="setGoal('lose')">Lose weight</button><button class="ghost" onclick="setGoal('gain')">Gain weight</button></div>`;
  const L=b.log,g=b.goal,last=L[L.length-1],first=L[0];
  h+=`<div class="card"><b>Goal: ${g==='lose'?'Lose':'Gain'} weight${b.target?' to '+fmt(b.target)+' kg':''}</b><div><button class="lnk" onclick="setTarget()">${b.target?'Edit':'Set'} target</button><button class="lnk" onclick="changeGoal()">Change goal</button></div></div>
  <div class="card"><div class="mut">Weight today (kg)</div><div class="two" style="margin-top:8px"><input id="bw" type="number" inputmode="decimal" aria-label="Body weight in kg" value="${last?last.w:''}" onfocus="this.select()"><button class="btn" style="margin:0" onclick="logW()">Log</button></div></div>`;
  if(!last)return h+'<p class="mut">Log your first weigh-in. The same time each morning gives the cleanest trend.</p>';
  const dl=last.w-first.w,good=g==='lose'?dl<0:dl>0;
  const note=L.length<2?'first entry':Math.abs(dl)<0.05?'no change':good?'toward your goal':'away from your goal';
  h+=`<div class="stats"><div class="card"><div class="mut">Current</div><b>${fmt(last.w)} kg</b></div><div class="card"><div class="mut">Since you started</div><b>${dl>0?'+':''}${fmt(dl)} kg</b><div class="mut">${note}</div></div></div>`;
  let tl='';
  if(b.target){const rem=g==='lose'?last.w-b.target:b.target-last.w;tl=`<div class="mut" style="margin-top:6px">${rem<=0?'Target reached.':fmt(rem)+' kg to go.'}</div>`}
  h+=`<div class="card"><div class="mut">Pace (last 4 weeks)</div><div>${pace(g,slope(L),last.w)}</div>${tl}</div>`;
  if(L.length>1)h+=`<div class="card"><div class="mut">Weight trend</div>${chart(L.slice(-30).map(x=>x.w),'Body weight trend')}</div>`;
  h+='<h2>Recent weigh-ins</h2><div class="card">'+L.slice(-8).reverse().map(x=>`<div class="hx"><span>${new Date(x.d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}</span><span>${fmt(x.w)} kg <button class="x" aria-label="Delete entry" onclick="delBW(${x.d})">✕</button></span></div>`).join('')+'</div>';
  return h+'<p class="mut">Weight moves day to day with water and food. Watch the trend, not a single weigh-in.</p>';
}
function tick(){
  const el=$('#el');if(el&&S.active)el.textContent=clock((Date.now()-S.active.start)/1000);
  const r=$('#rest');r.hidden=!(rest&&S.active);
  if(rest&&S.active){const s=Math.ceil((rest-Date.now())/1000);$('#rt').textContent=s>0?'Rest '+clock(s):'Rest over — next set'}
}
let wl=null;
async function wake(){
  try{
    if(S.active&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}
    else if(!S.active&&wl){await wl.release();wl=null}
  }catch(e){wl=null}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();tick()}});
function render(){
  $('#app').innerHTML={workout:vWorkout,history:vHistory,progress:vProgress,body:vBody}[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  tick();wake();
}
render();setInterval(tick,1000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
